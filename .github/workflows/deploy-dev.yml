yamlname: Deploy Dev

on:
  push:
    branches: [dev]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Inject dev Supabase config
        run: |
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.DEV_SUPABASE_URL }}|g" index.html
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.DEV_SUPABASE_ANON_KEY }}|g" index.html

      - name: Deploy to /dev subfolder
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: dev
          keep_files: true
