name: Deploy Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Inject production Supabase config
        run: |
          - name: Debug secrets
            run: |
              echo "URL length: ${#PROD_URL}"
              echo "KEY length: ${#PROD_KEY}"
            env:
              PROD_URL: ${{ secrets.PROD_SUPABASE_URL }}
              PROD_KEY: ${{ secrets.PROD_SUPABASE_ANON_KEY }}
          sed -i "s|SUPABASE_URL_PLACEHOLDER|${{ secrets.PROD_SUPABASE_URL }}|g" index.html
          sed -i "s|SUPABASE_KEY_PLACEHOLDER|${{ secrets.PROD_SUPABASE_ANON_KEY }}|g" index.html

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - uses: actions/deploy-pages@v4
        id: deployment
